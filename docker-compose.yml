# docker-compose.yml

services:
  postgres_roomie_db:
    image: postgres:15-alpine # Usamos Alpine por ser una imagen super ligera y segura
    container_name: roomiematch_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432" # Mapea el puerto del contenedor al puerto de tu computadora
    volumes:
      - roomie_db_data:/var/lib/postgresql/data # Persistencia: los datos no se borran si apagas el contenedor

volumes:
  roomie_db_data:
